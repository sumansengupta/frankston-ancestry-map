<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Frankston Road Crashes</title><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8}#app{min-height:100vh}.head{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd}h1{margin:0 0 5px;font-size:clamp(22px,5vw,30px)}.sub{color:#555;font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}.filter label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:3px}.filter select,button{height:38px;padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:#fff;font-size:14px}button{cursor:pointer;color:#1670c5}.status{font-size:13px;color:#444;padding-bottom:9px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:12px;padding:12px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}#map{height:calc(100vh - 185px);min-height:560px;background:#dbe7ef}.chartCard{padding:14px;height:calc(100vh - 185px);min-height:560px;display:flex;flex-direction:column}.chartTitle{font-weight:700;font-size:17px}.chartSub{font-size:12px;color:#666;margin:4px 0 10px}.chartWrap{position:relative;flex:1;min-height:0}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;background:#ddd}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0;border:0}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-right .leaflet-control{float:right}.leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:white;color:#222;font-weight:bold;font-size:20px;border-bottom:1px solid #ccc}.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:white;box-shadow:0 3px 14px #0004}.leaflet-popup-content{margin:13px 20px;line-height:1.4;font-size:13px}.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;text-align:center;text-decoration:none;color:#777}.leaflet-control-attribution{padding:2px 5px;background:#ffffffe6;font-size:10px}.legend{background:#fffffff2;padding:9px 11px;line-height:18px;border-radius:6px;box-shadow:0 1px 5px #0003;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.fatal{background:#7f0000}.serious{background:#d94801}.other{background:#fdae6b}.noninjury{background:#3182bd}@media(max-width:850px){.grid{grid-template-columns:1fr;padding:0;gap:10px}.card{border-radius:0;border-left:0;border-right:0}#map{height:58vh;min-height:460px}.chartCard{height:390px;min-height:390px}.filters{gap:6px}.head{padding:12px 10px}.status{width:100%;padding:2px 0 0}}
</style></head><body><div id="app"><div class="head"><h1>Frankston Road Crashes</h1><div class="sub">Victoria Road Crash Data • Esri World Street Map • Frankston LGA</div><div class="filters"><div class="filter"><label>SEVERITY</label><select id="severity"><option value="">All severities</option><option value="fatal">Fatal</option><option value="serious">Serious injury</option><option value="other">Other injury</option><option value="noninjury">Non injury</option></select></div><div class="filter"><label>YEAR</label><select id="year"><option value="">All years</option></select></div><div class="filter"><label>MONTH</label><select id="month"><option value="">All months</option></select></div><button id="reset">Reset filters</button><div class="status" id="status">Loading crash data…</div></div></div><div class="grid"><div class="card"><div id="map"></div></div><div class="card chartCard"><div class="chartTitle">Crash trend</div><div class="chartSub" id="chartSub">Monthly crashes by severity</div><div class="chartWrap"><canvas id="trend"></canvas></div></div></div></div><script>
const map=L.map('map',{preferCanvas:true,zoomAnimation:false,fadeAnimation:false}).setView([-38.15,145.14],11);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,keepBuffer:4,attribution:'Tiles &copy; Esri'}).addTo(map);const layer=L.layerGroup().addTo(map);const resourceId='5df1f373-0c90-48f5-80e1-7b2a35507134',api='https://discover.data.vic.gov.au/en_AU/api/3/action/datastore_search';let crashes=[],chart;
function field(r,...n){for(const x of n)if(r[x]!=null)return r[x];return''}function sev(raw,r={}){const s=String(raw??'').trim().toLowerCase();if(s==='1'||s==='01'||s.includes('fatal'))return'fatal';if(s==='2'||s==='02'||s.includes('serious'))return'serious';if(s==='3'||s==='03'||s.includes('other injury'))return'other';if(s==='4'||s==='04'||s.includes('non injury')||s.includes('non-injury'))return'noninjury';if((+field(r,'FATALITY')||0)>0)return'fatal';if((+field(r,'SERIOUSINJURY')||0)>0)return'serious';if((+field(r,'OTHERINJURY')||0)>0)return'other';return'noninjury'}function sname(s){return{fatal:'Fatal',serious:'Serious injury',other:'Other injury',noninjury:'Non injury'}[s]||'Unknown'}function scol(s){return{fatal:'#7f0000',serious:'#d94801',other:'#fdae6b',noninjury:'#3182bd'}[s]||'#777'}function parseDate(v){if(!v)return null;let s=String(v).trim(),d;if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){let p=s.split(/[\/ ]/);d=new Date(+p[2],+p[1]-1,+p[0])}else if(/^\d{8}$/.test(s)){d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))}else d=new Date(s);return isNaN(d)?null:d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}function frankston(r){return String(field(r,'LGA_NAME','LGA NAME','LGA')).trim().toUpperCase().startsWith('FRANKSTON')}
function norm(r){const d=parseDate(field(r,'ACCIDENT_DATE','ACCIDENT DATE'));return{id:field(r,'ACCIDENT_NO','ACCIDENT NO'),date:d,year:d?d.getFullYear():null,month:d?d.getMonth()+1:null,severity:sev(field(r,'SEVERITY'),r),road:field(r,'ROAD_NAME','ROAD NAME'),type:field(r,'ROAD_TYPE','ROAD TYPE'),lat:+field(r,'LATITUDE'),lon:+field(r,'LONGITUDE')}}
async function load(){let off=0,a=[];while(true){const u=`${api}?resource_id=${resourceId}&q=FRANKSTON&limit=1000&offset=${off}`;const j=await(await fetch(u,{cache:'no-store'})).json(),rs=j.result.records||[];a.push(...rs.filter(frankston));off+=rs.length;document.getElementById('status').textContent=`Loading… ${a.length} found`;if(rs.length<1000||off>=j.result.total)break}const seen=new Set();crashes=a.map(norm).filter(c=>Number.isFinite(c.lat)&&Number.isFinite(c.lon)&&c.date&&!seen.has(c.id)&&(seen.add(c.id),true));setupFilters();render()}
function setupFilters(){const ys=[...new Set(crashes.map(c=>c.year))].sort((a,b)=>b-a),y=document.getElementById('year');ys.forEach(v=>y.add(new Option(v,v)));const names=['January','February','March','April','May','June','July','August','September','October','November','December'],m=document.getElementById('month');names.forEach((n,i)=>m.add(new Option(n,i+1)))}function selected(){return{severity:document.getElementById('severity').value,year:+document.getElementById('year').value||null,month:+document.getElementById('month').value||null}}function filterData(){const f=selected();return crashes.filter(c=>(!f.severity||c.severity===f.severity)&&(!f.year||c.year===f.year)&&(!f.month||c.month===f.month))}
function render(){const f=selected(),data=filterData();layer.clearLayers();const bounds=[];data.forEach(c=>{L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:1,fillColor:scol(c.severity),fillOpacity:.88}).bindPopup(`<b>${sname(c.severity)}</b><br><b>Date:</b> ${c.date.toLocaleDateString('en-AU')}<br><b>Road:</b> ${esc((c.road+' '+c.type).trim())}<br><b>Crash ID:</b> ${esc(c.id)}`).addTo(layer);bounds.push([c.lat,c.lon])});document.getElementById('status').textContent=`${data.length.toLocaleString()} crashes displayed`;requestAnimationFrame(()=>map.invalidateSize());if(bounds.length)setTimeout(()=>map.fitBounds(bounds,{padding:[20,20],maxZoom:13,animate:false}),80);renderChart(f)}
function renderChart(f){let base=crashes.filter(c=>(!f.severity||c.severity===f.severity)&&(!f.year||c.year===f.year)&&(!f.month||c.month===f.month));let groups=new Map();base.forEach(c=>{let key,label;if(f.month){key=`${c.year}-${String(c.month).padStart(2,'0')}`;label=new Date(c.year,c.month-1).toLocaleDateString('en-AU',{month:'short',year:'numeric'})}else if(f.year){key=String(c.month).padStart(2,'0');label=new Date(2000,c.month-1).toLocaleDateString('en-AU',{month:'short'})}else{key=String(c.year);label=String(c.year)}if(!groups.has(key))groups.set(key,{label,fatal:0,serious:0,other:0,noninjury:0});groups.get(key)[c.severity]++});let rows=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);if(chart)chart.destroy();const ctx=document.getElementById('trend');chart=new Chart(ctx,{type:'line',data:{labels:rows.map(r=>r.label),datasets:[{label:'Fatal',data:rows.map(r=>r.fatal),borderColor:'#7f0000',backgroundColor:'#7f0000',tension:.2},{label:'Serious injury',data:rows.map(r=>r.serious),borderColor:'#d94801',backgroundColor:'#d94801',tension:.2},{label:'Other injury',data:rows.map(r=>r.other),borderColor:'#fdae6b',backgroundColor:'#fdae6b',tension:.2},{label:'Non injury',data:rows.map(r=>r.noninjury),borderColor:'#3182bd',backgroundColor:'#3182bd',tension:.2}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Number of crashes'}},x:{title:{display:true,text:f.year?'Month':'Year'}}}}});document.getElementById('chartSub').textContent=f.year?'Monthly crashes by severity':'Annual crashes by severity'}
['severity','year','month'].forEach(id=>document.getElementById(id).addEventListener('change',render));document.getElementById('reset').onclick=()=>{['severity','year','month'].forEach(id=>document.getElementById(id).value='');render()};const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Crash severity</b><br><i class="fatal"></i>Fatal<br><i class="serious"></i>Serious injury<br><i class="other"></i>Other injury<br><i class="noninjury"></i>Non injury';return d};legend.addTo(map);window.addEventListener('resize',()=>map.invalidateSize());load().catch(e=>{console.error(e);document.getElementById('status').textContent='Could not load crash data.'});
</script></body></html>
