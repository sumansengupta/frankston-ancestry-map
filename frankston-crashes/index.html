<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Victorian Road Crashes</title>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#202124}
.head{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd}
h1{margin:0 0 5px;font-size:clamp(22px,5vw,30px)}
.sub{font-size:13px;color:#666}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}
.filter label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:3px}
.filter select,button{height:38px;padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:#fff;font-size:14px}
button{cursor:pointer;color:#1670c5}.status{font-size:13px;color:#444;padding-bottom:9px;width:100%}
.page{padding:12px;display:grid;gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 1px 3px #0000000f;overflow:hidden}
.chartCard{padding:14px}.chartTitle{font-weight:700;font-size:17px}.chartSub{font-size:12px;color:#666;margin:4px 0 10px}.chartWrap{position:relative;height:330px}
.mapTitle{padding:12px 14px 0;font-weight:700;font-size:17px}.mapMsg{padding:4px 14px 0;font-size:12px;color:#666}#map{height:620px;margin-top:10px;background:#dbe7ef}
/* Essential Leaflet layout CSS embedded to keep iPhone tile positioning reliable */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;background:#ddd;-webkit-tap-highlight-color:transparent}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0;border:0}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-right .leaflet-control{float:right}.leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:#fff;color:#222;font-weight:bold;font-size:20px;border-bottom:1px solid #ccc}.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:#fff;box-shadow:0 3px 14px #0004}.leaflet-popup-content{margin:13px 20px;line-height:1.4;font-size:13px}.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;text-align:center;text-decoration:none;color:#777}.leaflet-control-attribution{padding:2px 5px;background:#ffffffe6;font-size:10px}
.legend{background:#fffffff2;padding:9px 11px;line-height:18px;border-radius:6px;box-shadow:0 1px 5px #0003;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.fatal{background:#7f0000}.serious{background:#d94801}.other{background:#fdae6b}.noninjury{background:#3182bd}
@media(max-width:700px){.head{padding:12px 10px}.page{padding:8px}.chartWrap{height:300px}#map{height:58vh;min-height:460px}.card{border-radius:8px}.filter{flex:1 1 46%}.filter select{width:100%}}
</style>
</head>
<body>
<div class="head">
  <h1>Victorian Road Crashes</h1>
  <div class="sub">Victoria Road Crash Data • Select an LGA first • Esri World Street Map</div>
  <div class="filters">
    <div class="filter"><label>LGA</label><select id="lga"><option value="">Select LGA…</option></select></div>
    <div class="filter"><label>SEVERITY</label><select id="severity"><option value="">All severities</option><option value="fatal">Fatal</option><option value="serious">Serious injury</option><option value="other">Other injury</option><option value="noninjury">Non injury</option></select></div>
    <div class="filter"><label>YEAR</label><select id="year"><option value="">All years</option></select></div>
    <div class="filter"><label>MONTH</label><select id="month"><option value="">All months</option></select></div>
    <button id="reset" type="button">Reset filters</button>
    <div id="status" class="status">Choose an LGA to load crash data.</div>
  </div>
</div>
<main class="page">
  <section class="card chartCard">
    <div class="chartTitle">Crash trend</div>
    <div class="chartSub" id="trendSub">Choose an LGA to view the trend.</div>
    <div class="chartWrap"><canvas id="trend"></canvas></div>
  </section>
  <section class="card">
    <div class="mapTitle">Crash locations</div>
    <div class="mapMsg" id="mapMsg">No statewide crash records are loaded. Select an LGA to load only that council area's crash points.</div>
    <div id="map"></div>
  </section>
</main>
<script>
const resourceId='5df1f373-0c90-48f5-80e1-7b2a35507134';
const api='https://discover.data.vic.gov.au/en_AU/api/3/action/datastore_search';
const lgas=['ALPINE','ARARAT','BALLARAT','BANYULE','BASS COAST','BAW BAW','BAYSIDE','BENALLA','BOROONDARA','BRIMBANK','BULOKE','CAMPASPE','CARDINIA','CASEY','CENTRAL GOLDFIELDS','COLAC OTWAY','CORANGAMITE','DAREBIN','EAST GIPPSLAND','FRANKSTON','GANNAWARRA','GLEN EIRA','GLENELG','GOLDEN PLAINS','GREATER BENDIGO','GREATER DANDENONG','GREATER GEELONG','GREATER SHEPPARTON','HEPBURN','HINDMARSH','HOBSONS BAY','HORSHAM','HUME','INDIGO','KINGSTON','KNOX','LATROBE','LODDON','MACEDON RANGES','MANNINGHAM','MANSFIELD','MARIBYRNONG','MAROONDAH','MELBOURNE','MELTON','MILDURA','MITCHELL','MOIRA','MONASH','MOONEE VALLEY','MOORABOOL','MORNINGTON PENINSULA','MOUNT ALEXANDER','MOYNE','MURRINDINDI','NILLUMBIK','NORTHERN GRAMPIANS','PORT PHILLIP','PYRENEES','QUEENSCLIFFE','SOUTH GIPPSLAND','SOUTHERN GRAMPIANS','STONNINGTON','STRATHBOGIE','SURF COAST','SWAN HILL','TOWONG','WANGARATTA','WARRNAMBOOL','WELLINGTON','WEST WIMMERA','WHITEHORSE','WHITTLESEA','WODONGA','WYNDHAM','YARRA','YARRA RANGES','YARRIAMBIACK'];
let crashes=[],trendChart=null,loadToken=0;
const map=L.map('map',{preferCanvas:true,zoomAnimation:false,fadeAnimation:false}).setView([-36.8,144.8],7);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,keepBuffer:4,attribution:'Tiles &copy; Esri'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function field(r,...names){for(const n of names){if(r[n]!==undefined&&r[n]!==null)return r[n]}return''}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function parseDate(v){if(!v)return null;const s=String(v).trim();let d;if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){const p=s.split(/[\/ ]/);d=new Date(+p[2],+p[1]-1,+p[0])}else if(/^\d{8}$/.test(s)){d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))}else d=new Date(s);return isNaN(d)?null:d}
function sev(raw,r={}){const s=String(raw??'').trim().toLowerCase();if(s==='1'||s==='01'||s.includes('fatal'))return'fatal';if(s==='2'||s==='02'||s.includes('serious'))return'serious';if(s==='3'||s==='03'||s.includes('other injury'))return'other';if(s==='4'||s==='04'||s.includes('non injury')||s.includes('non-injury'))return'noninjury';if((+field(r,'FATALITY','Fatality')||0)>0)return'fatal';if((+field(r,'SERIOUSINJURY','SERIOUS_INJURY','Serious Injury')||0)>0)return'serious';if((+field(r,'OTHERINJURY','OTHER_INJURY','Other Injury')||0)>0)return'other';return'noninjury'}
function sname(s){return{fatal:'Fatal',serious:'Serious injury',other:'Other injury',noninjury:'Non injury'}[s]||'Unknown'}
function scol(s){return{fatal:'#7f0000',serious:'#d94801',other:'#fdae6b',noninjury:'#3182bd'}[s]||'#777'}
function norm(r){const d=parseDate(field(r,'ACCIDENT_DATE','ACCIDENT DATE','Accident Date'));return{id:field(r,'ACCIDENT_NO','ACCIDENT NO','Accident No'),date:d,year:d?d.getFullYear():null,month:d?d.getMonth()+1:null,severity:sev(field(r,'SEVERITY','Severity'),r),lga:String(field(r,'LGA NAME','LGA_NAME','LGA Name','LGA')).trim(),road:field(r,'ROAD NAME','ROAD_NAME','Road Name'),type:field(r,'ROAD TYPE','ROAD_TYPE','Road Type'),lat:parseFloat(field(r,'LATITUDE','Latitude')),lon:parseFloat(field(r,'LONGITUDE','Longitude'))}}
async function apiJson(params){const qs=new URLSearchParams(params);const res=await fetch(`${api}?${qs.toString()}`,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const j=await res.json();if(!j.success)throw new Error('DataVic API error');return j.result}
function setupFilters(){const l=document.getElementById('lga');lgas.forEach(v=>l.add(new Option(v,v)));const y=document.getElementById('year');for(let yr=2025;yr>=2012;yr--)y.add(new Option(yr,yr));const names=['January','February','March','April','May','June','July','August','September','October','November','December'];const m=document.getElementById('month');names.forEach((n,i)=>m.add(new Option(n,i+1)))}
async function loadSelectedLga(){const token=++loadToken;const lga=document.getElementById('lga').value;crashes=[];layer.clearLayers();clearTrend();if(!lga){document.getElementById('status').textContent='Choose an LGA to load crash data.';document.getElementById('mapMsg').textContent='No statewide crash records are loaded. Select an LGA to load only that council area\'s crash points.';map.setView([-36.8,144.8],7);return}
document.getElementById('status').textContent=`Loading ${lga} crashes…`;let offset=0,all=[];try{while(true){const r=await apiJson({resource_id:resourceId,q:lga,limit:'1000',offset:String(offset)});if(token!==loadToken)return;const rows=r.records||[];const exact=rows.filter(x=>String(field(x,'LGA NAME','LGA_NAME','LGA Name','LGA')).trim().toUpperCase()===lga.toUpperCase());all.push(...exact);offset+=rows.length;document.getElementById('status').textContent=`Loading ${lga} crashes… ${all.length.toLocaleString()} found`;if(!rows.length||rows.length<1000||offset>=r.total)break}
const seen=new Set();crashes=all.map(norm).filter(c=>c.id&&c.date&&Number.isFinite(c.lat)&&Number.isFinite(c.lon)&&!seen.has(c.id)&&(seen.add(c.id),true));render();document.getElementById('status').textContent=`${crashes.length.toLocaleString()} ${lga} crashes loaded`}
catch(e){console.error(e);document.getElementById('status').textContent=`Could not load ${lga} crash data.`;document.getElementById('mapMsg').textContent='DataVic request failed. Try another LGA or refresh the page.'}}
function selected(){return{severity:document.getElementById('severity').value,year:+document.getElementById('year').value||null,month:+document.getElementById('month').value||null}}
function filtered(){const f=selected();return crashes.filter(c=>(!f.severity||c.severity===f.severity)&&(!f.year||c.year===f.year)&&(!f.month||c.month===f.month))}
function render(){const lga=document.getElementById('lga').value;if(!lga)return;const data=filtered();layer.clearLayers();const bounds=[];for(const c of data){L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:.7,fillColor:scol(c.severity),fillOpacity:.84}).bindPopup(`<b>${esc(c.lga)}</b><br><b>${sname(c.severity)}</b><br><b>Date:</b> ${c.date.toLocaleDateString('en-AU')}<br><b>Road:</b> ${esc((c.road+' '+c.type).trim())}<br><b>Crash ID:</b> ${esc(c.id)}`).addTo(layer);bounds.push([c.lat,c.lon])}document.getElementById('mapMsg').textContent=`${data.length.toLocaleString()} crash points shown for ${lga}`;requestAnimationFrame(()=>map.invalidateSize({pan:false}));if(bounds.length)setTimeout(()=>map.fitBounds(bounds,{padding:[20,20],maxZoom:12,animate:false}),60);renderTrend()}
function clearTrend(){if(trendChart){trendChart.destroy();trendChart=null}document.getElementById('trendSub').textContent='Choose an LGA to view the trend.'}
function renderTrend(){const f=selected();const lga=document.getElementById('lga').value;const groups=new Map();for(const c of crashes){if(f.severity&&c.severity!==f.severity)continue;if(f.month&&c.month!==f.month)continue;let key,label;if(f.year){if(c.year!==f.year)continue;key=String(c.month).padStart(2,'0');label=new Date(2000,c.month-1).toLocaleDateString('en-AU',{month:'short'})}else{key=String(c.year);label=String(c.year)}if(!groups.has(key))groups.set(key,{label,fatal:0,serious:0,other:0,noninjury:0});groups.get(key)[c.severity]++}
const rows=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);if(trendChart)trendChart.destroy();const defs=[{k:'fatal',l:'Fatal',c:'#7f0000'},{k:'serious',l:'Serious injury',c:'#d94801'},{k:'other',l:'Other injury',c:'#fdae6b'},{k:'noninjury',l:'Non injury',c:'#3182bd'}];const datasets=defs.filter(x=>!f.severity||x.k===f.severity).map(x=>({label:x.l,data:rows.map(r=>r[x.k]),borderColor:x.c,backgroundColor:x.c,tension:.2,pointRadius:3}));trendChart=new Chart(document.getElementById('trend'),{type:'line',data:{labels:rows.map(r=>r.label),datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Number of crashes'}},x:{title:{display:true,text:f.year?'Month':'Year'}}}}});let text=`${lga} • ${f.year?'Monthly':'Annual'} crash trend`;if(f.month)text+=` • ${new Date(2000,f.month-1).toLocaleString('en-AU',{month:'long'})}`;document.getElementById('trendSub').textContent=text}
document.getElementById('lga').addEventListener('change',loadSelectedLga);['severity','year','month'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if(crashes.length)render()}));document.getElementById('reset').addEventListener('click',()=>{document.getElementById('lga').value='';document.getElementById('severity').value='';document.getElementById('year').value='';document.getElementById('month').value='';crashes=[];layer.clearLayers();clearTrend();document.getElementById('status').textContent='Choose an LGA to load crash data.';document.getElementById('mapMsg').textContent='No statewide crash records are loaded. Select an LGA to load only that council area\'s crash points.';map.setView([-36.8,144.8],7)});
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Crash severity</b><br><i class="fatal"></i>Fatal<br><i class="serious"></i>Serious injury<br><i class="other"></i>Other injury<br><i class="noninjury"></i>Non injury';return d};legend.addTo(map);window.addEventListener('resize',()=>map.invalidateSize({pan:false}));setupFilters();
</script>
</body>
</html>
