<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Frankston Road Crashes</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#fff}
    #app{width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    header{flex:0 0 auto;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid #ddd;z-index:1000}
    h1{margin:0 0 4px;font-size:clamp(20px,5vw,28px);line-height:1.15}
    .sub{color:#555;font-size:13px;line-height:1.35}
    .controls{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    label{font-size:14px}
    select,button{min-height:38px;padding:7px 9px;border:1px solid #bbb;border-radius:7px;background:#fff;font-size:14px}
    button{cursor:pointer}
    #status{font-size:13px;color:#444;white-space:nowrap}
    #map{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:hidden;background:#dbe7ef}
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#ddd;outline-offset:1px}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
    .leaflet-tile::selection{background:transparent}
    .leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast}
    .leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0}
    .leaflet-marker-icon,.leaflet-marker-shadow{display:block}
    .leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
    .leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0;border:0}
    .leaflet-container.leaflet-touch-zoom{-ms-touch-action:pan-x pan-y;touch-action:pan-x pan-y}
    .leaflet-container.leaflet-touch-drag{-ms-touch-action:pinch-zoom;touch-action:none;touch-action:pinch-zoom}
    .leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{-ms-touch-action:none;touch-action:none}
    .leaflet-container a{-webkit-tap-highlight-color:rgba(51,181,229,.4)}
    .leaflet-tile{filter:inherit;visibility:hidden}
    .leaflet-tile-loaded{visibility:inherit}
    .leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}
    .leaflet-overlay-pane svg{-moz-user-select:none}
    .leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
    .leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
    .leaflet-control{margin:10px}.leaflet-right .leaflet-control{float:right}
    .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
    .leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:white;box-shadow:0 3px 14px rgba(0,0,0,.25)}
    .leaflet-popup-content{margin:13px 20px;line-height:1.4;font-size:13px;min-width:120px}
    .leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
    .leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg);background:white;box-shadow:3px 3px 14px rgba(0,0,0,.15)}
    .leaflet-popup-close-button{position:absolute;top:0;right:0;border:none!important;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,Verdana,sans-serif;color:#757575;text-decoration:none;background:transparent}
    .leaflet-control-attribution{padding:2px 5px;background:rgba(255,255,255,.85);font-size:10px}.leaflet-control-attribution a{text-decoration:none}
    .leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:white;color:#222;font-weight:bold;font-size:20px;border-bottom:1px solid #ccc}
    .leaflet-control-zoom a:first-child{border-radius:4px 4px 0 0}.leaflet-control-zoom a:last-child{border-radius:0 0 4px 4px;border-bottom:0}
    .legend{background:rgba(255,255,255,.96);padding:9px 11px;line-height:18px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:12px}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
    .fatal{background:#7f0000}.serious{background:#d94801}.other{background:#fdae6b}.noninjury{background:#3182bd}
    @media(max-width:600px){header{padding-left:10px;padding-right:10px}.sub{font-size:12px}.controls{gap:6px}#status{width:100%}.legend{font-size:11px;line-height:16px}}
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Frankston Road Crashes</h1>
    <div class="sub">Victoria Road Crash Data • Esri World Street Map • Frankston LGA</div>
    <div class="controls">
      <label>Severity:
        <select id="severityFilter">
          <option value="">All</option>
          <option value="fatal">Fatal accident</option>
          <option value="serious">Serious injury accident</option>
          <option value="other">Other injury accident</option>
          <option value="noninjury">Non injury accident</option>
        </select>
      </label>
      <button id="resetBtn" type="button">Reset view</button>
      <span id="status">Loading crash data…</span>
    </div>
  </header>
  <div id="map"></div>
</div>
<script>
const map=L.map('map',{preferCanvas:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([-38.15,145.14],11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,tileSize:256,updateWhenIdle:false,keepBuffer:4,attribution:'Tiles &copy; Esri'}).addTo(map);
const crashLayer=L.layerGroup().addTo(map);
const resourceId='5df1f373-0c90-48f5-80e1-7b2a35507134';
const apiBase='https://discover.data.vic.gov.au/en_AU/api/3/action/datastore_search';
const pageSize=1000;
let allCrashes=[];
function field(record,...names){for(const n of names){if(record[n]!==undefined&&record[n]!==null)return record[n]}return''}
function canonicalSeverity(raw,r={}){
 const s=String(raw??'').trim().toLowerCase();
 if(s==='1'||s==='01'||s.includes('fatal'))return'fatal';
 if(s==='2'||s==='02'||s.includes('serious'))return'serious';
 if(s==='3'||s==='03'||s.includes('other injury'))return'other';
 if(s==='4'||s==='04'||s.includes('non injury')||s.includes('non-injury')||s.includes('not injured'))return'noninjury';
 const fatality=parseFloat(field(r,'FATALITY','Fatality'))||0;
 const serious=parseFloat(field(r,'SERIOUSINJURY','SERIOUS_INJURY','Serious Injury'))||0;
 const other=parseFloat(field(r,'OTHERINJURY','OTHER_INJURY','Other Injury'))||0;
 if(fatality>0)return'fatal';
 if(serious>0)return'serious';
 if(other>0)return'other';
 return'noninjury';
}
function severityName(v){return({fatal:'Fatal accident',serious:'Serious injury accident',other:'Other injury accident',noninjury:'Non injury accident'})[v]||'Unknown'}
function severityColor(v){return({fatal:'#7f0000',serious:'#d94801',other:'#fdae6b',noninjury:'#3182bd'})[v]||'#777'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function isFrankston(r){const lga=String(field(r,'LGA_NAME','LGA NAME','LGA Name','LGA')).trim().toUpperCase();return lga==='FRANKSTON'||lga.startsWith('FRANKSTON ')}
function normalize(r){
 const severityClass=canonicalSeverity(field(r,'SEVERITY','Severity'),r);
 return{accidentNo:field(r,'ACCIDENT_NO','ACCIDENT NO','Accident No'),date:field(r,'ACCIDENT_DATE','ACCIDENT DATE','Accident Date'),severityClass,road:field(r,'ROAD_NAME','ROAD NAME','Road Name'),roadType:field(r,'ROAD_TYPE','ROAD TYPE','Road Type'),lat:parseFloat(field(r,'LATITUDE','Latitude')),lon:parseFloat(field(r,'LONGITUDE','Longitude'))}
}
function fixMapSize(){requestAnimationFrame(()=>map.invalidateSize({pan:false}))}
window.addEventListener('resize',fixMapSize);window.addEventListener('orientationchange',()=>{setTimeout(fixMapSize,150);setTimeout(fixMapSize,500)});window.addEventListener('pageshow',()=>setTimeout(fixMapSize,100));
async function loadData(){let offset=0,matches=[];while(true){const url=`${apiBase}?resource_id=${encodeURIComponent(resourceId)}&q=${encodeURIComponent('FRANKSTON')}&limit=${pageSize}&offset=${offset}`;const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const json=await res.json();if(!json.success)throw new Error('Data API error');const records=json.result.records||[];matches.push(...records.filter(isFrankston));offset+=records.length;document.getElementById('status').textContent=`Loading… ${matches.length.toLocaleString()} Frankston crashes found`;if(records.length<pageSize||offset>=json.result.total)break}
 const seen=new Set();allCrashes=matches.map(normalize).filter(c=>{if(!Number.isFinite(c.lat)||!Number.isFinite(c.lon))return false;const key=c.accidentNo||`${c.lat}|${c.lon}|${c.date}`;if(seen.has(key))return false;seen.add(key);return true});renderCrashes()}
function renderCrashes(){crashLayer.clearLayers();const selected=document.getElementById('severityFilter').value;const filtered=allCrashes.filter(c=>!selected||c.severityClass===selected);const bounds=[];for(const c of filtered){const marker=L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:1,fillColor:severityColor(c.severityClass),fillOpacity:.88});marker.bindPopup(`<strong>${esc(severityName(c.severityClass))}</strong><br><b>Date:</b> ${esc(c.date)}<br><b>Road:</b> ${esc((c.road+' '+c.roadType).trim())}<br><b>Crash ID:</b> ${esc(c.accidentNo)}`);marker.addTo(crashLayer);bounds.push([c.lat,c.lon])}document.getElementById('status').textContent=`${filtered.length.toLocaleString()} crashes displayed`;fixMapSize();if(bounds.length)setTimeout(()=>{fixMapSize();map.fitBounds(bounds,{padding:[24,24],maxZoom:13,animate:false})},100)}
document.getElementById('severityFilter').addEventListener('change',renderCrashes);document.getElementById('resetBtn').addEventListener('click',()=>{document.getElementById('severityFilter').value='';renderCrashes()});
const legend=L.control({position:'bottomright'});legend.onAdd=function(){const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Crash severity</b><br><i class="fatal"></i>Fatal<br><i class="serious"></i>Serious injury<br><i class="other"></i>Other injury<br><i class="noninjury"></i>Non injury';return d};legend.addTo(map);
setTimeout(fixMapSize,50);setTimeout(fixMapSize,300);loadData().catch(err=>{console.error(err);document.getElementById('status').textContent='Could not load crash data. Please refresh the page.'});
</script>
</body>
</html>
