<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Victorian Road Crashes</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#202124}
    .head{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1200}
    h1{margin:0 0 5px;font-size:clamp(22px,5vw,30px)}
    .sub{font-size:13px;color:#666}
    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}
    .filter label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:3px}
    .filter select,button{height:38px;padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:#fff;font-size:14px}
    button{cursor:pointer;color:#1670c5}
    .status{font-size:13px;color:#444;padding-bottom:9px}
    .page{padding:12px;display:grid;gap:12px}
    .card{background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 1px 3px #0000000f;overflow:hidden}
    .chartCard{padding:14px}
    .chartTitle{font-weight:700;font-size:17px}
    .chartSub{font-size:12px;color:#666;margin:4px 0 10px}
    .chartWrap{position:relative;height:300px}
    .trendWrap{height:330px}
    .mapTitle{padding:12px 14px 0;font-weight:700;font-size:17px}
    .mapMsg{padding:4px 14px 0;font-size:12px;color:#666}
    #map{height:620px;margin-top:10px;background:#dbe7ef}
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden;background:#ddd}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
    .leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0;border:0}
    .leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
    .leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-right .leaflet-control{float:right}
    .leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:#fff;color:#222;font-weight:bold;font-size:20px;border-bottom:1px solid #ccc}
    .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:#fff;box-shadow:0 3px 14px #0004}.leaflet-popup-content{margin:13px 20px;line-height:1.4;font-size:13px}.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;text-align:center;text-decoration:none;color:#777}
    .leaflet-control-attribution{padding:2px 5px;background:#ffffffe6;font-size:10px}
    .legend{background:#fffffff2;padding:9px 11px;line-height:18px;border-radius:6px;box-shadow:0 1px 5px #0003;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.fatal{background:#7f0000}.serious{background:#d94801}.other{background:#fdae6b}.noninjury{background:#3182bd}
    @media(max-width:700px){.head{padding:12px 10px;position:relative}.page{padding:8px}.status{width:100%;padding:2px 0}.chartWrap{height:260px}.trendWrap{height:300px}#map{height:58vh;min-height:460px}.card{border-radius:8px}}
  </style>
</head>
<body>
  <div class="head">
    <h1>Victorian Road Crashes</h1>
    <div class="sub">Victoria Road Crash Data • All Victorian LGAs • Esri World Street Map</div>
    <div class="filters">
      <div class="filter"><label>LGA</label><select id="lga"><option value="FRANKSTON">FRANKSTON</option></select></div>
      <div class="filter"><label>SEVERITY</label><select id="severity"><option value="">All severities</option><option value="fatal">Fatal</option><option value="serious">Serious injury</option><option value="other">Other injury</option><option value="noninjury">Non injury</option></select></div>
      <div class="filter"><label>YEAR</label><select id="year"><option value="">All years</option></select></div>
      <div class="filter"><label>MONTH</label><select id="month"><option value="">All months</option></select></div>
      <button id="reset">Reset filters</button>
      <div id="status" class="status">Loading dashboard…</div>
    </div>
  </div>

  <main class="page">
    <section class="card chartCard">
      <div class="chartTitle">Top 5 LGAs by crashes</div>
      <div class="chartSub" id="topSub">Loading statewide LGA counts…</div>
      <div class="chartWrap"><canvas id="top5"></canvas></div>
    </section>

    <section class="card chartCard">
      <div class="chartTitle">Crash trend</div>
      <div class="chartSub" id="trendSub">Crash trend by severity</div>
      <div class="chartWrap trendWrap"><canvas id="trend"></canvas></div>
    </section>

    <section class="card">
      <div class="mapTitle">Crash locations</div>
      <div class="mapMsg" id="mapMsg">Only the selected LGA's crash points are loaded to keep the dashboard fast.</div>
      <div id="map"></div>
    </section>
  </main>

<script>
const resourceId='5df1f373-0c90-48f5-80e1-7b2a35507134';
const api='https://discover.data.vic.gov.au/en_AU/api/3/action/datastore_search';
let crashes=[],trendChart,topChart,loadToken=0;

const fallbackLgas=['ALPINE','ARARAT','BALLARAT','BANYULE','BASS COAST','BAW BAW','BAYSIDE','BENALLA','BOROONDARA','BRIMBANK','BULOKE','CAMPASPE','CARDINIA','CASEY','CENTRAL GOLDFIELDS','COLAC OTWAY','CORANGAMITE','DAREBIN','EAST GIPPSLAND','FRANKSTON','GANNAWARRA','GLEN EIRA','GLENELG','GOLDEN PLAINS','GREATER BENDIGO','GREATER DANDENONG','GREATER GEELONG','GREATER SHEPPARTON','HEPBURN','HINDMARSH','HOBSONS BAY','HORSHAM','HUME','INDIGO','KINGSTON','KNOX','LATROBE','LODDON','MACEDON RANGES','MANNINGHAM','MANSFIELD','MARIBYRNONG','MAROONDAH','MELBOURNE','MELTON','MILDURA','MITCHELL','MOIRA','MONASH','MOONEE VALLEY','MOORABOOL','MORNINGTON PENINSULA','MOUNT ALEXANDER','MOYNE','MURRINDINDI','NILLUMBIK','NORTHERN GRAMPIANS','PORT PHILLIP','PYRENEES','QUEENSCLIFFE','SOUTH GIPPSLAND','SOUTHERN GRAMPIANS','STONNINGTON','STRATHBOGIE','SURF COAST','SWAN HILL','TOWONG','WANGARATTA','WARRNAMBOOL','WELLINGTON','WEST WIMMERA','WHITEHORSE','WHITTLESEA','WODONGA','WYNDHAM','YARRA','YARRA RANGES','YARRIAMBIACK'];

const map=L.map('map',{preferCanvas:true,zoomAnimation:false,fadeAnimation:false}).setView([-38.15,145.14],11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,keepBuffer:4,attribution:'Tiles &copy; Esri'}).addTo(map);
const layer=L.layerGroup().addTo(map);

function field(r,...names){for(const n of names){if(r[n]!==undefined&&r[n]!==null)return r[n]}return''}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function parseDate(v){if(!v)return null;const s=String(v).trim();let d;if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){const p=s.split(/[\/ ]/);d=new Date(+p[2],+p[1]-1,+p[0])}else if(/^\d{8}$/.test(s)){d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))}else d=new Date(s);return isNaN(d)?null:d}
function sev(raw,r={}){const s=String(raw??'').trim().toLowerCase();if(s==='1'||s==='01'||s.includes('fatal'))return'fatal';if(s==='2'||s==='02'||s.includes('serious'))return'serious';if(s==='3'||s==='03'||s.includes('other injury'))return'other';if(s==='4'||s==='04'||s.includes('non injury')||s.includes('non-injury'))return'noninjury';if((+field(r,'FATALITY')||0)>0)return'fatal';if((+field(r,'SERIOUSINJURY')||0)>0)return'serious';if((+field(r,'OTHERINJURY')||0)>0)return'other';return'noninjury'}
function sname(s){return{fatal:'Fatal',serious:'Serious injury',other:'Other injury',noninjury:'Non injury'}[s]||'Unknown'}
function scol(s){return{fatal:'#7f0000',serious:'#d94801',other:'#fdae6b',noninjury:'#3182bd'}[s]||'#777'}
function norm(r){const d=parseDate(field(r,'ACCIDENT_DATE','ACCIDENT DATE'));return{id:field(r,'ACCIDENT_NO','ACCIDENT NO'),date:d,year:d?d.getFullYear():null,month:d?d.getMonth()+1:null,severity:sev(field(r,'SEVERITY','Severity'),r),lga:String(field(r,'LGA NAME','LGA_NAME','LGA')).trim(),road:field(r,'ROAD NAME','ROAD_NAME'),type:field(r,'ROAD TYPE','ROAD_TYPE'),lat:+field(r,'LATITUDE'),lon:+field(r,'LONGITUDE')}}
async function apiJson(params){const qs=new URLSearchParams(params);const res=await fetch(`${api}?${qs.toString()}`,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const j=await res.json();if(!j.success)throw new Error('DataVic API error');return j.result}

function populateLgas(values){const sel=document.getElementById('lga'),current=sel.value||'FRANKSTON';sel.innerHTML='';[...new Set(values.map(v=>String(v).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>sel.add(new Option(v,v)));if([...sel.options].some(o=>o.value===current))sel.value=current;else if([...sel.options].some(o=>o.value==='FRANKSTON'))sel.value='FRANKSTON'}

async function loadLgaList(){
  populateLgas(fallbackLgas);
  try{
    const r=await apiJson({resource_id:resourceId,fields:'LGA NAME',distinct:'true',limit:'500',records_format:'lists',include_total:'false'});
    const vals=(r.records||[]).map(x=>Array.isArray(x)?x[0]:field(x,'LGA NAME','LGA_NAME')).filter(Boolean);
    if(vals.length>20)populateLgas(vals);
  }catch(e){console.warn('Distinct LGA request failed; using fallback list',e)}
}

async function loadTop5(){
  const counts=new Map();
  try{
    let offset=0,total=Infinity;
    while(offset<total){
      const r=await apiJson({resource_id:resourceId,fields:'LGA NAME',limit:'10000',offset:String(offset),records_format:'lists',include_total:offset===0?'true':'false'});
      const rows=r.records||[];
      if(offset===0&&Number.isFinite(+r.total))total=+r.total;
      rows.forEach(x=>{const lga=String(Array.isArray(x)?x[0]:field(x,'LGA NAME','LGA_NAME')).trim();if(lga)counts.set(lga,(counts.get(lga)||0)+1)});
      offset+=rows.length;
      document.getElementById('topSub').textContent=`Counting statewide crashes… ${offset.toLocaleString()}`;
      if(!rows.length||rows.length<10000)break;
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    const rows=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(!rows.length)throw new Error('No LGA counts returned');
    if(topChart)topChart.destroy();
    topChart=new Chart(document.getElementById('top5'),{type:'bar',data:{labels:rows.map(r=>r[0]),datasets:[{label:'Crashes',data:rows.map(r=>r[1]),backgroundColor:'#4e79a7'}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,title:{display:true,text:'Number of crashes'}}}}});
    document.getElementById('topSub').textContent='Top 5 Victorian LGAs across the full crash dataset';
  }catch(e){console.error('Top 5 failed',e);document.getElementById('topSub').textContent='Top 5 could not be loaded. Detailed LGA map and trend remain available.'}
}

function setupFilters(){const y=document.getElementById('year');for(let yr=2025;yr>=2012;yr--)y.add(new Option(yr,yr));const names=['January','February','March','April','May','June','July','August','September','October','November','December'],m=document.getElementById('month');names.forEach((n,i)=>m.add(new Option(n,i+1)))}

async function loadSelectedLga(){
  const token=++loadToken,lga=document.getElementById('lga').value;if(!lga)return;
  document.getElementById('status').textContent=`Loading ${lga} crashes…`;
  crashes=[];let offset=0,all=[];
  const wanted=['ACCIDENT NO','ACCIDENT_DATE','SEVERITY','LGA NAME','LATITUDE','LONGITUDE','ROAD NAME','ROAD TYPE','FATALITY','SERIOUSINJURY','OTHERINJURY'].join(',');
  const filterJson=JSON.stringify({'LGA NAME':lga});
  while(true){
    const r=await apiJson({resource_id:resourceId,filters:filterJson,fields:wanted,limit:'5000',offset:String(offset)});
    if(token!==loadToken)return;
    const rows=r.records||[];all.push(...rows);offset+=rows.length;
    if(!rows.length||rows.length<5000||offset>=r.total)break;
  }
  const seen=new Set();
  crashes=all.map(norm).filter(c=>c.id&&c.date&&Number.isFinite(c.lat)&&Number.isFinite(c.lon)&&!seen.has(c.id)&&(seen.add(c.id),true));
  render();
  document.getElementById('status').textContent=`${crashes.length.toLocaleString()} ${lga} crashes loaded`;
}

function selected(){return{severity:document.getElementById('severity').value,year:+document.getElementById('year').value||null,month:+document.getElementById('month').value||null}}
function filtered(){const f=selected();return crashes.filter(c=>(!f.severity||c.severity===f.severity)&&(!f.year||c.year===f.year)&&(!f.month||c.month===f.month))}

function render(){
  const f=selected(),data=filtered(),lga=document.getElementById('lga').value;
  layer.clearLayers();const bounds=[];
  data.forEach(c=>{L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:.7,fillColor:scol(c.severity),fillOpacity:.84}).bindPopup(`<b>${esc(c.lga)}</b><br><b>${sname(c.severity)}</b><br><b>Date:</b> ${c.date.toLocaleDateString('en-AU')}<br><b>Road:</b> ${esc((c.road+' '+c.type).trim())}<br><b>Crash ID:</b> ${esc(c.id)}`).addTo(layer);bounds.push([c.lat,c.lon])});
  document.getElementById('mapMsg').textContent=`${data.length.toLocaleString()} crash points shown for ${lga}`;
  requestAnimationFrame(()=>map.invalidateSize());
  if(bounds.length)setTimeout(()=>map.fitBounds(bounds,{padding:[20,20],maxZoom:12,animate:false}),60);
  renderTrend();
}

function renderTrend(){
  const f=selected(),groups=new Map();
  crashes.forEach(c=>{
    if(f.severity&&c.severity!==f.severity)return;
    if(f.month&&c.month!==f.month)return;
    let key,label;
    if(f.year){if(c.year!==f.year)return;key=String(c.month).padStart(2,'0');label=new Date(2000,c.month-1).toLocaleDateString('en-AU',{month:'short'})}
    else{key=String(c.year);label=String(c.year)}
    if(!groups.has(key))groups.set(key,{label,fatal:0,serious:0,other:0,noninjury:0});
    groups.get(key)[c.severity]++;
  });
  const rows=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);
  if(trendChart)trendChart.destroy();
  const specs=[{k:'fatal',l:'Fatal',c:'#7f0000'},{k:'serious',l:'Serious injury',c:'#d94801'},{k:'other',l:'Other injury',c:'#fdae6b'},{k:'noninjury',l:'Non injury',c:'#3182bd'}];
  const ds=specs.filter(x=>!f.severity||x.k===f.severity).map(x=>({label:x.l,data:rows.map(r=>r[x.k]),borderColor:x.c,backgroundColor:x.c,tension:.2}));
  trendChart=new Chart(document.getElementById('trend'),{type:'line',data:{labels:rows.map(r=>r.label),datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Number of crashes'}},x:{title:{display:true,text:f.year?'Month':'Year'}}}}});
  document.getElementById('trendSub').textContent=`${document.getElementById('lga').value} • ${f.year?'Monthly':'Annual'} crash trend`;
}

['severity','year','month'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('lga').addEventListener('change',loadSelectedLga);
document.getElementById('reset').onclick=()=>{document.getElementById('severity').value='';document.getElementById('year').value='';document.getElementById('month').value='';if([...document.getElementById('lga').options].some(o=>o.value==='FRANKSTON'))document.getElementById('lga').value='FRANKSTON';loadSelectedLga()};

const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Crash severity</b><br><i class="fatal"></i>Fatal<br><i class="serious"></i>Serious injury<br><i class="other"></i>Other injury<br><i class="noninjury"></i>Non injury';return d};legend.addTo(map);
window.addEventListener('resize',()=>map.invalidateSize());

setupFilters();
(async()=>{await loadLgaList();if([...document.getElementById('lga').options].some(o=>o.value==='FRANKSTON'))document.getElementById('lga').value='FRANKSTON';loadSelectedLga();loadTop5()})().catch(e=>{console.error(e);document.getElementById('status').textContent='Could not initialise dashboard.'});
</script>
</body>
</html>
